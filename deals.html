const CATS=["全部","API额度","会员试用","每日积分","限时活动","长期免费"];
let activeCat="全部";

function renderFilters(){
  document.getElementById("filters").innerHTML = CATS.map(c=>{
    const n = c==="全部" ? DEALS.length : DEALS.filter(d=>d.cat===c).length;
    if(c!=="全部" && n===0) return "";
    return `<button class="chip" aria-pressed="${c===activeCat}" data-cat="${c}">${c} · ${n}</button>`;
  }).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;render();});
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function render(){
  renderFilters();
  const list = activeCat==="全部" ? DEALS : DEALS.filter(d=>d.cat===activeCat);
  const g = document.getElementById("grid");
  if(!list.length){ g.innerHTML = '<p class="empty">这个分类暂时没有持续有效的羊毛。</p>'; return; }
  g.innerHTML = list.map(d=>`
    <article class="card">
      <div class="card-top"><h2>${esc(d.n)}</h2><span class="cat">${esc(d.cat)}</span></div>
      <p class="what">${esc(d.what)}</p>
      <p class="how"><b>怎么领</b>${esc(d.how)}</p>
      <div class="meta-row">
        <span>⏳ ${esc(d.until)}</span>
        <span class="ok">✔ 核实 ${esc(d.checked)}</span>
        <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.src)} ↗</a>
      </div>
    </article>`).join("");
  const newest = DEALS.map(d=>d.checked).sort().pop() || "";
  document.getElementById("updated").textContent = `最后更新 ${newest} · 共 ${DEALS.length} 条在架`;
}

render();
</script>
