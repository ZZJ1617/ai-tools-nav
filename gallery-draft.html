<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI灵感画廊 · 提示词印样 | 赛博上片指南</title>
<meta name="robots" content="noindex">
<style>
/* ── 设计说明（frontend-design skill 落地草案）─────────────────────────
   主体：赛博上片指南 · AI 图片提示词库。借用电影工业的「接触印样 / 场记板」
   语言：每张卡片 = 一格印样，卡底带片边码；弹窗 = 场记板（斜纹条 + 等宽字段）。
   调色：纸白 + 石墨墨色，唯一的彩色是场记板黄 #F2C200（只出现在三处：选中
   chip、片边码、复制按钮）。全部字体走系统栈，不加载外链字体。
─────────────────────────────────────────────────────────────────── */
:root{
  --paper:#FAFAF8; --surface:#FFFFFF; --ink:#141410; --ink2:#5F5C55; --ink3:#9A968D;
  --line:rgba(20,20,16,.13); --slate:#F2C200; --slate-ink:#1A1A14;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --shadow:0 1px 2px rgba(20,20,16,.05),0 12px 28px -18px rgba(20,20,16,.35);
}
html[data-theme="dark"]{
  --paper:#131311; --surface:#1B1B18; --ink:#EDEBE4; --ink2:#A8A49A; --ink3:#6E6A61;
  --line:rgba(255,255,255,.13); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 28px -18px rgba(0,0,0,.9);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
.container{max-width:1160px;margin:0 auto;padding:0 22px}

/* 顶栏 */
.theme-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:16px 22px;max-width:1160px;margin:0 auto}
.theme-btn,.back-btn{font-family:var(--mono);font-size:12px;letter-spacing:.02em;background:transparent;
  border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer;color:var(--ink2);
  text-decoration:none;transition:color .18s,border-color .18s}
.theme-btn:hover,.back-btn:hover{color:var(--ink);border-color:var(--ink3)}

/* 页头 */
header{padding:26px 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
header h1{font-size:clamp(30px,5.4vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.06;margin:12px 0 0}
header h1 em{font-style:normal;color:var(--ink3)}
.sub{color:var(--ink2);font-size:15px;margin-top:12px;max-width:62ch}
.note{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:10px;padding-bottom:22px}

/* 分类 chips */
.chip-bar{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 20px}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.02em;background:transparent;border:1px solid var(--line);
  border-radius:3px;padding:6px 12px;cursor:pointer;color:var(--ink2);transition:all .16s;user-select:none}
.chip:hover{color:var(--ink);border-color:var(--ink3)}
.chip.active{background:var(--slate);border-color:var(--slate);color:var(--slate-ink);font-weight:700}

/* 印样网格 */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px;padding-bottom:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--ink3)}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--paper);filter:saturate(1.02)}
.card-body{padding:11px 13px 13px}
.edge{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);
  display:flex;gap:8px;align-items:center;transition:color .18s}
.edge b{font-weight:700;color:inherit}
.card:hover .edge{color:#8a7300}
html[data-theme="dark"] .card:hover .edge{color:var(--slate)}
.card-title{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin-top:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tag{display:none}
.card-copy{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:6px;letter-spacing:.02em}
.card:hover .card-copy{color:var(--ink2)}

/* 场记板弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(12,12,10,.72);z-index:100;padding:22px;
  overflow-y:auto;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:5px;max-width:760px;width:100%;
  padding:0 0 22px;position:relative;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* ← signature：场记板斜纹条，只此一处用彩色条纹 */
.slate-bar{height:15px;border-radius:4px 4px 0 0;
  background:repeating-linear-gradient(115deg,var(--slate) 0 20px,#111 20px 40px)}
.slate-inner{padding:20px 24px 0}
.modal-close{position:absolute;top:19px;right:20px;font-size:20px;background:transparent;border:1px solid var(--line);
  border-radius:3px;width:30px;height:30px;color:var(--ink3);cursor:pointer;line-height:1;transition:all .18s}
.modal-close:hover{color:var(--ink);border-color:var(--ink3)}
.modal-box img{width:100%;border-radius:3px;border:1px solid var(--line);margin-bottom:16px;display:block}
.modal-title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px;padding-right:36px}
.modal-cat{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px}
.modal-tip{font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.field{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.field span{color:var(--line);letter-spacing:0;font-size:10px}
.prompt-box{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:3px;
  padding:13px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  margin-bottom:14px;max-height:250px;overflow-y:auto;color:var(--ink)}
.copy-btn{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  background:var(--slate);color:var(--slate-ink);border:none;border-radius:3px;padding:12px 20px;cursor:pointer;
  width:100%;transition:filter .18s}
.copy-btn:hover{filter:brightness(1.08)}
.copy-btn.copied{background:#16a34a;color:#fff}
/* 主题替换对比 */
.duo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.duo-item{border-radius:3px;overflow:hidden;position:relative;border:1px solid var(--line)}
.duo-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border:none;margin:0;border-radius:0}
.duo-label{position:absolute;bottom:0;left:0;right:0;background:rgba(12,12,10,.66);color:#fff;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:4px 8px;text-align:center}
.empty{padding:70px 0;text-align:center;color:var(--ink3);font-family:var(--mono);font-size:13px}
footer{padding:30px 0 40px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px}
footer .container{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
footer a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink);border-color:var(--ink3)}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:11px}
  .card-title{font-size:13px}.card-body{padding:9px 10px 11px}
  .slate-inner{padding:16px 16px 0}
}
</style>
</head>
<body>
<div class="theme-bar">
  <a href="index.html" class="back-btn">← 返回导航</a>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" aria-label="切换明暗主题">🌙 暗色</button>
</div>

<header class="container">
  <div class="eyebrow">赛博上片指南 · Prompt Sheet</div>
  <h1>AI灵感画廊<em> / 提示词印样</em></h1>
  <p class="sub">精选 AI 图片，每张附完整提示词。点开卡片 = 拉下场记板，复制提示词即可生成同款。</p>
  <p class="note">玩法 — 复制提示词 → 去 即梦 / 豆包 / 可灵 生成；把「一只猫」换成你的主题就是新图。</p>
</header>

<main class="container">
  <div class="chip-bar" id="chipBar"></div>
  <div class="gallery-grid" id="galleryGrid"></div>
  <div class="empty" id="emptyState" style="display:none">这个分类还没有印样，敬请期待</div>
</main>

<footer>
  <div class="container">
    <span>© 赛博上片指南 · 图片均为 AI 生成示例</span>
    <a href="index.html">AI创作工具导航 →</a>
  </div>
</footer>

<!-- 场记板弹窗 -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="slate-bar"></div>
    <button class="modal-close" onclick="closeModal()" aria-label="关闭">✕</button>
    <div class="slate-inner"><div id="modalContent"></div></div>
  </div>
</div>

<script src="gallery.js"></script>
<script>
/* 卡片片边码：覆盖 JS 渲染出的标记（仅视觉层，不动 gallery.js 逻辑） */
const _origRenderGrid = renderGrid;
renderGrid = function(){
  const grid = document.getElementById("galleryGrid");
  const empty = document.getElementById("emptyState");
  const items = currentCat === "all" ? GALLERY : GALLERY.filter(g => g.cat === currentCat);
  empty.style.display = items.length ? "none" : "block";
  grid.innerHTML = items.map((g, i) => {
    const catLabel = (CATS.find(c => c.key === g.cat)?.label || g.cat);
    return `
    <div class="card" onclick="openModal('${g.id}')">
      <img src="${g.img}" alt="${g.title}" loading="lazy">
      <div class="card-body">
        <div class="edge"><b>SC ${String(i + 1).padStart(2,"0")}</b> ${catLabel}</div>
        <div class="card-title">${g.title}</div>
        <div class="card-copy">⌘ 点开 · 复制提示词</div>
      </div>
    </div>`;
  }).join("");
};
renderGrid();
function toggleTheme(){const h=document.documentElement,b=document.getElementById('themeBtn');
  if(h.dataset.theme==='dark'){h.dataset.theme='light';b.textContent='🌙 暗色';localStorage.setItem('theme','light')}
  else{h.dataset.theme='dark';b.textContent='☀️ 亮色';localStorage.setItem('theme','dark')}}
(function(){const t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.dataset.theme='dark';
  document.getElementById('themeBtn').textContent='☀️ 亮色'}})();
</script>
</body>
</html>
