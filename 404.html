<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>页面不存在 · AI 创作工具导航</title>
<link rel="canonical" href="https://zzj1617.github.io/ai-tools-nav/">
<style>
  :root{--ink:#14140F;--paper:#F6F6F3;--ink2:#4A4A40;--ink3:#8A8A7A;--line:#DEDCD4;--yel:#F2C200;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){:root{--ink:#F6F6F3;--paper:#14140F;--ink2:#C9C9BF;--ink3:#8A8A7A;--line:#33332B}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:32px 20px}
  main{max-width:460px;width:100%;text-align:center}
  .band{height:14px;background:repeating-linear-gradient(-45deg,var(--yel) 0 16px,var(--ink) 16px 32px);
    border-radius:3px;margin-bottom:26px}
  .code{font-family:var(--mono);font-size:64px;font-weight:700;letter-spacing:.02em;line-height:1}
  h1{font-size:20px;margin:16px 0 8px;letter-spacing:-.01em}
  p{font-size:14px;color:var(--ink3);margin:0 0 26px;line-height:1.75}
  a.btn{display:inline-block;padding:11px 22px;border:1px solid var(--ink);border-radius:3px;
    color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;transition:background .18s,color .18s}
  a.btn:hover{background:var(--ink);color:var(--paper)}
  .site{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:30px;letter-spacing:.06em}
</style>
</head>
<body>
<main>
  <div class="band" aria-hidden="true"></div>
  <div class="code">404</div>
  <h1>这个链接不存在</h1>
  <p>可能是工具下架了，或者地址打错了。<br>回导航页看看还在的工具吧。</p>
  <a class="btn" href="/ai-tools-nav/">← 回到 AI 创作工具导航</a>
  <div class="site">赛博上片指南 · AI 创作工具导航</div>
</main>
</body>
</html>
