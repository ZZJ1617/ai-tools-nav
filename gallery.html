<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI灵感画廊 | 赛博上片指南 - 热门AI图片提示词库</title>
<meta name="description" content="AI灵感画廊：热门AI海报/电商/氛围感图片精选，每张附完整提示词，一键复制去生成。主题替换玩法，同一主体多种风格。">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://zzj1617.github.io/ai-tools-nav/gallery.html">
<style>
:root{--bg:#ffffff;--bg-alt:#f6f5f4;--surface:#ffffff;--text:rgba(0,0,0,0.9);--text2:#615d59;--text3:#a39e98;--brand:#0075de;--brand-hover:#005bab;--border:rgba(0,0,0,0.1);--shadow:0 4px 18px rgba(0,0,0,0.04),0 2px 7.85px rgba(0,0,0,0.027),0 0.8px 2.93px rgba(0,0,0,0.02)}
html[data-theme="dark"]{--bg:#141414;--bg-alt:#1d1d1f;--surface:#1d1d1f;--text:rgba(255,255,255,0.92);--text2:#b0aca6;--text3:#6f6b66;--brand:#4da6ff;--brand-hover:#7ab8ff;--border:rgba(255,255,255,0.14);--shadow:0 4px 18px rgba(0,0,0,0.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s}
.container{max-width:1100px;margin:0 auto;padding:0 20px}
.theme-bar{display:flex;justify-content:flex-end;align-items:center;padding:14px 20px;max-width:1100px;margin:0 auto}
.theme-btn,.back-btn{background:var(--bg-alt);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--text);transition:all .2s}
.theme-btn:hover,.back-btn:hover{border-color:var(--brand);color:var(--brand)}
.back-btn{text-decoration:none;margin-right:10px}
header{padding:32px 0 8px}
header h1{font-size:28px;font-weight:700;letter-spacing:-0.02em}
header p{color:var(--text2);margin-top:6px;font-size:15px}
.chip-bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 24px}
.chip{background:var(--bg-alt);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;color:var(--text2);transition:all .2s;user-select:none}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding-bottom:60px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--bg-alt)}
.card-body{padding:10px 12px}
.card-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tag{display:inline-block;font-size:11px;color:var(--brand);background:rgba(0,117,222,0.08);border-radius:4px;padding:1px 6px;margin-top:6px}
.card-copy{font-size:11px;color:var(--text3);margin-top:4px}
/* 弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;padding:24px;overflow-y:auto}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:var(--surface);border-radius:16px;max-width:720px;width:100%;padding:24px;position:relative;animation:fadeIn .25s}
.modal-box img{width:100%;border-radius:10px;margin-bottom:16px}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;background:none;border:none;color:var(--text3);cursor:pointer;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:4px}
.modal-cat{font-size:12px;color:var(--brand);margin-bottom:12px}
.modal-tip{font-size:12px;color:var(--text3);margin-bottom:8px}
.prompt-box{background:var(--bg-alt);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;margin-bottom:16px;max-height:240px;overflow-y:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.copy-btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;cursor:pointer;width:100%;transition:background .2s;font-weight:600}
.copy-btn:hover{background:var(--brand-hover)}
.copy-btn.copied{background:#16a34a}
/* 主题替换对比 */
.duo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.duo-item{border-radius:8px;overflow:hidden;position:relative}
.duo-item img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.duo-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;padding:3px 8px;text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.empty{padding:60px 0;text-align:center;color:var(--text3)}
footer{padding:32px 0;text-align:center;color:var(--text2);border-top:1px solid var(--border);font-size:14px}
footer a{color:var(--brand);text-decoration:none}
@media(max-width:560px){.gallery-grid{grid-template-columns:repeat(2,1fr);gap:10px}.card-title{font-size:12px}}
</style>
</head>
<body>
<div class="theme-bar">
  <a href="index.html" class="back-btn">← 返回导航</a>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" aria-label="切换明暗主题">🌙 暗色模式</button>
</div>

<header class="container">
  <h1>🎨 AI灵感画廊</h1>
  <p>热门 AI 图片精选 · 每张附完整提示词 · 点击卡片查看大图 + 一键复制提示词</p>
  <p style="font-size:13px;color:var(--text3);margin-top:4px">💡 玩法：复制提示词 → 去 即梦 / 豆包 / 可灵 生成同款，把「一只猫」换成你的主题就是新图</p>
</header>

<main class="container">
  <div class="chip-bar" id="chipBar"></div>
  <div class="gallery-grid" id="galleryGrid"></div>
  <div class="empty" id="emptyState" style="display:none">这个分类还没有图片，敬请期待</div>
</main>

<footer>
  <p>© 赛博上片指南 · <a href="index.html">AI创作工具导航</a> · 图片均为 AI 生成示例，提示词可自由使用</p>
</footer>

<!-- 弹窗 -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="gallery.js"></script>
<script>
function toggleTheme(){const h=document.documentElement,b=document.getElementById('themeBtn');if(h.dataset.theme==='dark'){h.dataset.theme='light';b.textContent='🌙 暗色模式';localStorage.setItem('theme','light')}else{h.dataset.theme='dark';b.textContent='☀️ 亮色模式';localStorage.setItem('theme','dark')}}
(function(){const t=localStorage.getItem('theme');if(t==='dark'){document.documentElement.dataset.theme='dark';document.getElementById('themeBtn').textContent='☀️ 亮色模式'}})();
</script>
</body>
</html>
