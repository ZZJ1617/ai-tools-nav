function toggleTheme(){
  const html=document.documentElement,btn=document.getElementById('themeBtn');
  if(html.dataset.theme==='dark'){html.dataset.theme='light';btn.innerHTML='🌙 暗色模式';localStorage.setItem('theme','light')}
  else{html.dataset.theme='dark';btn.innerHTML='☀️ 浅色模式';localStorage.setItem('theme','dark')}
}
(function initTheme(){
  const saved=localStorage.getItem('theme');
  const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(saved==='dark'||(!saved&&prefersDark)){document.documentElement.dataset.theme='dark';document.getElementById('themeBtn').innerHTML='☀️ 浅色模式'}
})();

function renderHotspot(){
  if(!HOTSPOT.items.length)return;
  const h=document.getElementById('hotspot');
  const tip=i=>[i.d,[i.params,i.scene].filter(Boolean).join(' · ')].filter(Boolean).join('\n').replace(/"/g,'&quot;');
  const tiles=HOTSPOT.items.map(i=>{
    const inner=`<span class="tile-emoji">${i.t}</span><span class="tile-h">${i.h}</span>${i.link?'<span class="tile-src">消息来源 →</span>':''}`;
    return i.link
      ? `<a class="sheet-tile" href="${i.link}" target="_blank" rel="noopener" title="${tip(i)}">${inner}</a>`
      : `<div class="sheet-tile" title="${tip(i)}">${inner}</div>`;
  }).join('');
  h.innerHTML=`<header class="sheet-head"><span class="sheet-kicker">今日通告 · Call Sheet</span><span class="sheet-date">${HOTSPOT.date}</span></header><div class="sheet-tiles">${tiles}</div>`;
}

// 大类计数（基于 m 数组）
const mainTools=id=>id==='all'?TOOLS:TOOLS.filter(t=>(t.m||[]).includes(id));
const mainCounts={};MAINS.forEach(m=>mainCounts[m.id]=mainTools(m.id).length);
// 细分列表：某大类下的细分（用 c 去重，保持出现顺序）
function subCatsOf(mainId){
  const list=mainTools(mainId);
  const seen=[];list.forEach(t=>{if(!seen.includes(t.c))seen.push(t.c)});
  return seen;
}
// 当前大类下的细分计数
function subCountsOf(mainId,sub){return mainTools(mainId).filter(t=>t.c===sub).length}

const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('toolCount'),freeBtn=document.getElementById('freeBtn'),openBtn=document.getElementById('openBtn'),filtersWrap=document.getElementById('filtersWrap'),sortSelect=document.getElementById('sortSelect'),catSide=document.getElementById('catSide');

function renderCatSide(){
  catSide.innerHTML=MAINS.map(m=>`<button class="cat-btn ${m.id===activeMain?'active':''}" data-main="${m.id}" aria-pressed="${m.id===activeMain}"><span class="cat-icon">${m.icon}</span>${m.label}<span class="cat-count">${mainCounts[m.id]}</span></button>`).join('');
}

// ===== 细分横向chips渲染（跟随大类） =====
function renderSubCats(){
  const subs=activeMain==='all'?[]:subCatsOf(activeMain);
  const filtersEl=document.getElementById('filters');
  if(activeMain==='all'){
    // 全部：显示全部细分（两级都要能筛）

    filtersEl.innerHTML=`<button class="filter-pill active" data-cat="" aria-pressed="true">全部 <span class="pill-count">${totalTools}</span></button>`+allSubs.map(c=>`<button class="filter-pill" data-cat="${c}" aria-pressed="false">${c} <span class="pill-count">${TOOLS.filter(t=>t.c===c).length}</span></button>`).join('');
  }else{
    // 某大类下：细分chips（首个为"全部"+大类名）
    filtersEl.innerHTML=`<button class="filter-pill active" data-cat="" aria-pressed="true">全部 <span class="pill-count">${mainCounts[activeMain]}</span></button>`+subs.map(c=>`<button class="filter-pill" data-cat="${c}" aria-pressed="false">${c} <span class="pill-count">${subCountsOf(activeMain,c)}</span></button>`).join('');

}

// ===== URL 状态同步：筛出来的结果可以分享/收藏 =====
function syncUrl(){
  const p=new URLSearchParams();
  if(searchQuery)p.set('q',searchQuery);
  if(activeMain&&activeMain!=='all')p.set('main',activeMain);
  if(activeCat)p.set('cat',activeCat);
  if(showFree)p.set('free','1');
  if(showOpen)p.set('open','1');
  if(sortMode&&sortMode!=='rating-desc')p.set('sort',sortMode);
  if(currentPage>0)p.set('page',String(currentPage+1));
  const qs=p.toString();
  history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));
}

  const p=new URLSearchParams(location.search);
  searchQuery=p.get('q')||'';
  activeMain=p.get('main')||'all';
  activeCat=p.get('cat')||null;
  showFree=p.get('free')==='1';
  showOpen=p.get('open')==='1';
  sortMode=p.get('sort')||'rating-desc';
  const pg=parseInt(p.get('page')||'1',10);
  currentPage=(isNaN(pg)||pg<1)?0:pg-1;
