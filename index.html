function renderHotspot(){
  if(!HOTSPOT.items.length)return;
  const h=document.getElementById('hotspot');
  const cards=HOTSPOT.items.map(i=>{
    const tags=`<span class="hotspot-tag">${i.params}</span><span class="hotspot-tag">${i.scene}</span>`;
    const link=i.link?`<div style="margin-top:10px"><a href="${i.link}" target="_blank" rel="noopener" style="font-size:13px;font-weight:600;color:var(--brand);text-decoration:none">🔗 立即试用 →</a></div>`:'';
    return `<article class="hotspot-card"><strong>${i.t} ${i.h}</strong> — ${i.d}${tags}${link}</article>`;
  }).join('');
  h.innerHTML=`<div class="hotspot-header"><div class="hotspot-dot"></div><span class="hotspot-title">🔴 今日AI工具热点</span><span class="hotspot-date">${HOTSPOT.date}</span></div><div class="hotspot-grid">${cards}</div>`;
}

function checkScrollHint(){const el=document.getElementById('filters');filtersWrap.classList.toggle('can-scroll',el.scrollWidth>el.clientWidth+2)}
window.addEventListener('resize',checkScrollHint);setTimeout(checkScrollHint,100);

function debounce(fn,wait){let t;return function(...args){clearTimeout(t);t=setTimeout(()=>fn.apply(this,args),wait)}}

function getSortedTools(tools){const sorted=[...tools];switch(sortMode){case'rating-desc':sorted.sort((a,b)=>(b.r||0)-(a.r||0)||a.n.localeCompare(b.n));break;case'rating-asc':sorted.sort((a,b)=>(a.r||0)-(b.r||0)||a.n.localeCompare(b.n));break;case'name-asc':sorted.sort((a,b)=>a.n.localeCompare(b.n,'zh-CN'));break;case'name-desc':sorted.sort((a,b)=>b.n.localeCompare(a.n,'zh-CN'));break;case'hot-desc':sorted.sort((a,b)=>(b.hot||0)-(a.hot||0)||(b.r||0)-(a.r||0));break}return sorted}

function diffLabel(d){if(!d||d===1)return{cls:'badge-diff-easy',t:'🟢 简单'};if(d===2)return{cls:'badge-diff-mid',t:'🟡 中等'};return{cls:'badge-diff-hard',t:'🔴 复杂'}}
function zhLabel(z){if(!z||z===1)return'🇨🇳 中文';if(z===2)return'🌐 部分中文';return'❌ 无中文'}
function hotLabel(h){if(!h||h===1)return'';if(h===2)return'🔥 热门';return'🔥🔥 很火'}

function render(fc,q,free,scene){
  q=(q||'').toLowerCase().trim();
  const sceneObj=SCENES.find(s=>s.id===scene);
  const sceneCats=sceneObj&&sceneObj.cats.length?sceneObj.cats:null;
  let s=0;const filtered=[];
  TOOLS.forEach(t=>{
    if(free&&!t.f)return;
    if(fc&&t.c!==fc)return;
    if(sceneCats&&!sceneCats.includes(t.c))return;
    if(q&&!t.n.toLowerCase().includes(q)&&!t.d.toLowerCase().includes(q))return;
    filtered.push(t);
  });
  const sorted=getSortedTools(filtered);
  const totalPages=Math.ceil(sorted.length/PAGE_SIZE)||1;
  if(currentPage>=totalPages)currentPage=totalPages-1;
  const start=currentPage*PAGE_SIZE,pageItems=sorted.slice(start,start+PAGE_SIZE);
  const fragment=document.createDocumentFragment();
  pageItems.forEach((t,idx)=>{
    const links=[];
    if(t.u)links.push(`<a href="${t.u}" target="_blank" rel="noopener" class="card-link">🔗 官网</a>`);
    if(t.g)links.push(`<a href="${t.g}" target="_blank" rel="noopener" class="card-link">📦 开源</a>`);
    if(t.w)links.push(`<a href="${t.w}" target="_blank" rel="noopener" class="card-link">📖 文章</a>`);
    const l=links.length?links.join(' '):'<span class="card-link disabled">暂无链接</span>';
    const stars='★'.repeat(t.r||0)+'☆'.repeat(5-(t.r||0));
    const dm=(t.u&&t.u.startsWith('http'))?new URL(t.u).hostname:(t.g?new URL(t.g).hostname:'');
    const palette=['#07c160','#ff6b6b','#4ecdc4','#45b7d1','#f39c12','#9b59b6','#e74c3c','#1abc9c','#3498db','#e67e22','#2ecc71','#e91e63'];
    const cc=palette[t.n.length%palette.length];
    const ic=dm?`<img class="card-icon" src="https://${dm}/favicon.ico" alt="" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='inline-flex'"><span class="card-icon-fallback" style="background:${cc};display:none" aria-hidden="true">${t.n[0]}</span>`:`<span class="card-icon-fallback" style="background:${cc}" aria-hidden="true">${t.n[0]}</span>`;
    const df=diffLabel(t.diff);
    const hl=hotLabel(t.hot);
    const badges=[];
    if(t.new)badges.push('<span class="card-badge badge-new">🆕 新收录</span>');
    badges.push(`<span class="card-badge ${df.cls}">${df.t}</span>`);
    if(t.zh!==3)badges.push(`<span class="card-badge badge-zh">${zhLabel(t.zh)}</span>`);
    if(hl)badges.push(`<span class="card-badge badge-hot">${hl}</span>`);
    const div=document.createElement('article');div.className='card';
    div.style.animationDelay=`${Math.min(idx*.04,.4)}s`;
    div.innerHTML=`${t.v?'<span class="card-vpn" aria-label="需要梯子">🪜</span>':''}<div class="card-badge-wrap">${badges.join('')}</div><div class="card-name">${t.n}${ic}</div>${t.q?`<div class="card-quota">${t.q}</div>`:''}<div class="card-stars" aria-label="评分 ${t.r||0} 星">${stars} · ${t.re}</div><div class="card-cat">${t.c}</div><div class="card-desc">${t.d}</div><div class="card-actions">${l}</div>`;
    fragment.appendChild(div);s++;
  });
  grid.innerHTML='';
  if(s===0){grid.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔍</div><h3>未找到匹配的工具</h3><p>尝试更换关键词、切换场景/分类，或清除筛选条件</p></div>'}
  else{grid.appendChild(fragment)}
  count.textContent='';
  let pg=document.getElementById('pagination');
  if(!pg){pg=document.createElement('div');pg.id='pagination';pg.style.cssText='display:flex;justify-content:center;align-items:center;gap:8px;margin-top:24px;flex-wrap:wrap';grid.parentNode.insertBefore(pg,grid.nextSibling)}
  if(totalPages<=1){pg.innerHTML='';return}
  let html='';
  if(currentPage>0)html+='<button class="page-btn" onclick="goPage('+(currentPage-1)+')">‹ 上一页</button>';
  for(let i=Math.max(0,currentPage-2);i<Math.min(totalPages,currentPage+3);i++){
    html+=i===currentPage?'<span class="page-btn active">'+(i+1)+'</span>':'<button class="page-btn" onclick="goPage('+i+')">'+(i+1)+'</button>'
  }
  if(currentPage<totalPages-1)html+='<button class="page-btn" onclick="goPage('+(currentPage+1)+')">下一页 ›</button>';
  pg.innerHTML=html;
}
function goPage(n){currentPage=n;render(activeCat,searchQuery,showFree,activeScene)}

render(null,'',false,'all');

// 分类
document.getElementById('filters').addEventListener('click',e=>{
  const pill=e.target.closest('.filter-pill');if(!pill)return;
  document.querySelectorAll('.filter-pill').forEach(p=>{p.classList.remove('active');p.setAttribute('aria-pressed','false')});
  pill.classList.add('active');pill.setAttribute('aria-pressed','true');
  activeCat=pill.dataset.cat||null;currentPage=0;
  render(activeCat,searchQuery,showFree,activeScene);
});

// 场景
document.getElementById('sceneWrap').addEventListener('click',e=>{
  const pill=e.target.closest('.scene-pill');if(!pill)return;
  document.querySelectorAll('.scene-pill').forEach(p=>{p.classList.remove('active');p.setAttribute('aria-pressed','false')});
  pill.classList.add('active');pill.setAttribute('aria-pressed','true');
  activeScene=pill.dataset.scene||'all';currentPage=0;
  // 重置分类到全部
  document.querySelectorAll('.filter-pill').forEach(p=>{p.classList.remove('active');p.setAttribute('aria-pressed','false')});
  document.querySelector('.filter-pill[data-cat=""]')?.classList.add('active');
  document.querySelector('.filter-pill[data-cat=""]')?.setAttribute('aria-pressed','true');
  activeCat=null;
  render(activeCat,searchQuery,showFree,activeScene);
});

// 免费
freeBtn.addEventListener('click',()=>{
  showFree=!showFree;freeBtn.classList.toggle('active',showFree);freeBtn.setAttribute('aria-pressed',showFree?'true':'false');
  if(showFree){document.querySelectorAll('.filter-pill').forEach(p=>{p.classList.remove('active');p.setAttribute('aria-pressed','false')});document.querySelector('.filter-pill[data-cat=""]')?.classList.add('active');document.querySelector('.filter-pill[data-cat=""]')?.setAttribute('aria-pressed','true');activeCat=null}
  render(activeCat,searchQuery,showFree,activeScene);
});

// 搜索
search.addEventListener('input',debounce(()=>{searchQuery=search.value;currentPage=0;render(activeCat,searchQuery,showFree,activeScene)},250));

// 排序
sortSelect.addEventListener('change',()=>{sortMode=sortSelect.value;currentPage=0;render(activeCat,searchQuery,showFree,activeScene)});

// 归档
function renderArchive(){
  document.getElementById('archiveGrid').innerHTML=ARCHIVED.map(a=>`<div class="archive-card"><div class="archive-name">${a.n}</div><div style="font-size:12px;color:var(--text3)">${a.c}</div><div class="archive-reason">⚠️ ${a.reason}</div></div>`).join('');
}
renderArchive();

// 返回顶部
function toggleCollapse(id){
  const header=document.getElementById(id+'Header');
  const body=document.getElementById(id+'Body');
  const isOpen=body.classList.contains('open');
  if(isOpen){body.classList.remove('open');header.classList.remove('open');header.setAttribute('aria-expanded','false')}
  else{body.classList.add('open');header.classList.add('open');header.setAttribute('aria-expanded','true')}
}

// 返回顶部
const backToTop=document.getElementById('backToTop');
window.addEventListener('scroll',()=>{if(window.scrollY>500){backToTop.classList.add('visible')}else{backToTop.classList.remove('visible')}});
</script>
